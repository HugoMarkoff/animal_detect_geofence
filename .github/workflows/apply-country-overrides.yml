name: Apply Country Overrides

on:
  push:
    branches:
      - main
    paths:
      - data/review-overrides/**
      - tools/apply_country_overrides.py
      - .github/workflows/apply-country-overrides.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply tracked overrides
        run: python tools/apply_country_overrides.py

      - name: Commit regenerated packs and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet --exit-code -- data/precomputed-countries data/animals-global.json data/geofence-simple.json; then
            echo "No regenerated override-derived artifacts to commit."
            git push origin HEAD:gh-pages
            exit 0
          fi
          git add data/precomputed-countries data/animals-global.json data/geofence-simple.json
          git commit -m "Apply country overrides"
          git push --atomic origin HEAD:main HEAD:gh-pages