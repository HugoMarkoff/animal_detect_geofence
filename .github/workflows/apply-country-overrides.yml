name: Apply Country Overrides

on:
  push:
    branches:
      - main
    paths:
      - data/review-overrides/**
      - tools/cleanup_review_tracking.py
      - tools/apply_country_overrides.py
      - .github/workflows/apply-country-overrides.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize review tracking
        run: python tools/cleanup_review_tracking.py

      - name: Apply tracked overrides
        run: python tools/apply_country_overrides.py

      - name: Commit regenerated packs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet --exit-code -- data/review-overrides data/precomputed-countries data/animals-global.json data/geofence-simple.json; then
            echo "No regenerated override-derived artifacts to commit."
            exit 0
          fi
          git add data/review-overrides data/precomputed-countries data/animals-global.json data/geofence-simple.json
          git commit -m "Apply country overrides"
          git push origin HEAD:main

      - name: Request GitHub Pages rebuild
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          request = Request(
              f"https://api.github.com/repos/{repository}/pages/builds",
              data=b"{}",
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2026-03-10",
                  "User-Agent": "github-actions-pages-rebuild",
                  "Content-Type": "application/json",
              },
          )
          with urlopen(request) as response:
              payload = json.load(response)
          print(json.dumps(payload, indent=2))
          PY